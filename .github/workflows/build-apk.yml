name: Build & Sign Release APK

# Hanya jalan bila ko tekan butang 'Run workflow' secara manual
on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build, Sign & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Pasang Dependencies Projek & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: 5. Build Web Assets (Vite)
        run: npm run build

      - name: 6. Sediakan Platform Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Salin Ikon Aplikasi (Folder res / android-res)
        run: |
          if [ -d "res" ]; then
            echo "Folder res dijumpai, menyalin ke android/app/src/main/res..."
            cp -r res/* android/app/src/main/res/
          elif [ -d "android-res" ]; then
            echo "Folder android-res dijumpai, menyalin ke android/app/src/main/res..."
            cp -r android-res/* android/app/src/main/res/
          fi

      - name: 8. Beri Kebenaran Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 9. Compile Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 10. Sign Release APK Secara Automatik
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: 11. Muat Naik Hasil Release APK (Signed)
        uses: actions/upload-artifact@v4
        with:
          name: AutoWebP-Release-Signed-APK
          path: ${{ steps.sign_app.outputs.signedFile }}
          retention-days: 14
