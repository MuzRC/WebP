name: Build & Sign Release APK

# Hanya jalan bila ditekan secara manual
on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Pasang Dependensi Projek
        run: |
          npm install --legacy-peer-deps

      - name: 5. Build Web Assets (Vite)
        run: npm run build

      - name: 6. Sediakan Platform Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Salin Ikon Aplikasi (Jika Ada Folder res)
        run: |
          if [ -d "res" ]; then
            echo "Folder res dijumpai. Menyalin ke android/app/src/main/res/..."
            cp -r res/* android/app/src/main/res/
          fi

      - name: 8. Beri Kebenaran Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 9. Compile Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 10. Sign Release APK (Guna GitHub Secrets)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: 11. Muat Naik Hasil Release APK Siap Sign
        uses: actions/upload-artifact@v4
        with:
          name: AutoWebP-Release-Signed-APK
          path: ${{ steps.sign_app.outputs.signedFile }}
          retention-days: 14
